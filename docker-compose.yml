services:
  db:
    image: postgres:16
    container_name: sothos-db
    environment:
      POSTGRES_USER: sothos
      POSTGRES_PASSWORD: sothos_dev
      POSTGRES_DB: sothos
    ports:
      - "5432:5432"
    volumes:
      - sothos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sothos -d sothos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: sothos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sothos:sothos_dev@db:5432/sothos?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"

volumes:
  sothos_pgdata: