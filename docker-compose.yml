
services:
  db:
    image: postgres:18
    container_name: sothos-db
    environment:
      POSTGRES_USER: sothos
      POSTGRES_PASSWORD: sothos_dev
      POSTGRES_DB: sothos
    ports:
      - "5432:5432"
    volumes:
      - sothos_pgdata_demo:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sothos -d sothos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dkalob/sothos-api:mvp
    container_name: sothos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sothos:sothos_dev@db:5432/sothos?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Sothos}
      EMAIL_BRAND_NAME: ${EMAIL_BRAND_NAME:-Sothos}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_RESERVA: ${GEMINI_MODEL_RESERVA:-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-}
    image: dkalob/sothos-web:mvp
    container_name: sothos-web
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  sothos_pgdata_demo:
